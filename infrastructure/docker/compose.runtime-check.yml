# Reuse the two images scanned by CI; run analytics with the scanned Python runtime.
services:
  migrate:
    build: !reset null
  analytics:
    image: fincore-render-demo:verified
    pull_policy: never
    build: !reset null
    command: [/opt/analytics/bin/python, -m, uvicorn, 'app:app', --app-dir, services/financial-analytics, --host, 0.0.0.0, --port, '8000']
    healthcheck:
      test: [CMD, /opt/analytics/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
